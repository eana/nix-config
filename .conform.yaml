policies:
  - type: commit
    spec:
      header:
        length: 60
        imperative: true
        case: lower
        invalidLastCharacters: .
      conventional:
        types:
          - feat
          - fix
          - build
          - chore
          - ci
          - docs
          - perf
          - refactor
          - style
          - test
        scopes:
          - module
          - deps
          - devshell
          - configurations
          - home
          - hosts
          - secrets
          - assets
          - flake
        descriptionLength: 60
